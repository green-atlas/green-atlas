name: Suggest an Organization for Green Atlas
description: Suggest a European sustainability organization to be added to Green Atlas
title: 'Suggesting a new organization'
labels: ['new-organization']
body:
  - type: markdown
    attributes:
      value: |
        👉 Please add the details for the new organization below

        We list European organizations focused on sustainability, ESG, social impact, and green technology that are currently active and operational.

        Thanks for taking the time to suggest an organization! 🌱
  - type: input
    id: organization-name
    attributes:
      label: Organization Name
      description: What's the name of the organization?
      placeholder: 'Example: Green Atlas'
    validations:
      required: true

  - type: input
    id: website
    attributes:
      label: Website
      description: The organization's official website
      placeholder: 'https://example.com'
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Which category fits this organization best?
      options:
        - Climate Action
        - Circular Economy
        - Green Technology
        - Social Impact & Inclusion
        - ESG & Governance
        - Renewable Energy
        - Sustainable Finance
        - Conservation & Biodiversity
        - Sustainable Agriculture
        - Clean Mobility
        - Waste Management
        - Water Resources
        - Environmental Education
        - Policy & Advocacy
        - Research & Innovation
        - Other (please specify in description)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Briefly describe the organization's sustainability focus and impact (max 150 characters)
      placeholder: 'Example: Non-profit advancing circular economy practices across European industries...'
    validations:
      required: true

  - type: dropdown
    id: country
    attributes:
      label: Company's Main Location
      description: In which European country is the company mainly based?
      options:
        - 🇦🇹 Austria
        - 🇧🇪 Belgium
        - 🇧🇬 Bulgaria
        - 🇭🇷 Croatia
        - 🇨🇾 Cyprus
        - 🇨🇿 Czech Republic
        - 🇩🇰 Denmark
        - 🇪🇪 Estonia
        - 🇫🇮 Finland
        - 🇫🇷 France
        - 🇩🇪 Germany
        - 🇬🇷 Greece
        - 🇭🇺 Hungary
        - 🇮🇪 Ireland
        - 🇮🇸 Iceland
        - 🇮🇹 Italy
        - 🇱🇻 Latvia
        - 🇱🇮 Liechtenstein
        - 🇱🇹 Lithuania
        - 🇱🇺 Luxembourg
        - 🇲🇹 Malta
        - 🇲🇨 Monaco
        - 🇳🇱 Netherlands
        - 🇳🇴 Norway
        - 🇵🇱 Poland
        - 🇵🇹 Portugal
        - 🇷🇴 Romania
        - 🇸🇲 San Marino
        - 🇷🇸 Serbia
        - 🇸🇰 Slovakia
        - 🇸🇮 Slovenia
        - 🇪🇸 Spain
        - 🇸🇪 Sweden
        - 🇨🇭 Switzerland
        - 🇺🇦 Ukraine
        - 🇬🇧 United Kingdom
        - Other (please specify)
    validations:
      required: true

  - type: input
    id: legal-country
    attributes:
      label: Legal Registration Country
      description: If the company is legally registered in a different country, please specify (optional). This is often visible in their terms of service.
      placeholder: 'Example: United States'

  - type: checkboxes
    id: requirements
    attributes:
      label: Requirements
      description: Please confirm the following
      options:
        - label: The organization is currently active and operational
          required: true
        - label: The organization has a clear focus on sustainability, ESG, social impact, or green technology
          required: true
        - label: The organization is relevant for EU funding and grant applications (Förderanträge)
          required: true
        - label: I've checked that this organization isn't already listed
          required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Anything else you'd like to tell us about this organization?
      placeholder: 'Optional: Any other details that might be helpful...'
